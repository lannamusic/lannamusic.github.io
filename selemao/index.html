rc="https://www.youtube.com/embed/R025Gnv6z5s" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen="allowfullscreen"></iframe></div><div class="post__iframe"><iframe loading="lazy" class="yt-embed" src="https://www.youtube.com/embed/ZtlRNRIFHRs" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen="allowfullscreen"></iframe></div><div class="post__iframe"><iframe loading="lazy" class="yt-embed" src="https://www.youtube.com/embed/vsdg5Vxnkig" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen="allowfullscreen"></iframe></div></div></div></article><div class="main__right main__right--bottom"></div></main><footer class="footer"><div class="footer__copyright">Creative Commons Attribution-NonCommercial-NoDerivatives 3.0 Thailand License</div></footer></div></div><script defer="defer" src="https://lannamusic.github.io/assets/js/scripts.min.js"></script><script>var images = document.querySelectorAll('img[loading]');
   
           for (var i = 0; i < images.length; i++) {

           }</script><script>(() => {
   
       // ============================================================
       // PARAMÈTRES DE SYNCHRONISATION
       // ============================================================
   
       // Recherche du div contenant les données de synchronisation
       // et l'identifiant YouTube.
       const syncElement = document.querySelector(
           '[data-sync][data-youtube-url]'
       );
   
       if (!syncElement) {
           console.error(
               'Élément contenant data-sync et data-youtube-url introuvable.'
           );
           return;
       }
   
       // Récupération des données depuis les attributs HTML
       let sync;
   
       try {
           sync = JSON.parse(syncElement.dataset.sync);
       } catch (error) {
           console.error(
               'Impossible de lire data-sync :',
               error
           );
           return;
       }
   
       const youtubeUrl = syncElement.dataset.youtubeUrl;
   
       if (!youtubeUrl) {
           console.error('data-youtube-url est vide.');
           return;
       }
   
   
       // ============================================================
       // VÉRIFICATION DES DONNÉES DE SYNCHRONISATION
       // ============================================================
   
       if (
           !Array.isArray(sync) ||
           sync.length < 2 ||
           typeof sync[0].time !== "number" ||
           typeof sync[0]["x-offset"] !== "number" ||
           typeof sync[1].time !== "number" ||
           typeof sync[1]["x-offset"] !== "number"
       ) {
           console.error(
               'Format invalide pour data-sync.',
               sync
           );
           return;
       }
   
       // Premier point de synchronisation
       const TIME_1 = sync[0].time;
       const X_1 = sync[0]["x-offset"];
   
       // Dernier point de synchronisation
       const TIME_2 = sync[sync.length - 1].time;
       const X_2 = sync[sync.length - 1]["x-offset"];
   
   
       // Pixels de partition par seconde
       const PIXELS_PER_SECOND =
           (X_2 - X_1) / (TIME_2 - TIME_1);
   
   
       // ============================================================
       // PARTITION SVG
       // ============================================================
   
       const score = document.querySelector(
           'svg[width="7057"][height="150"]'
       );
   
       if (!score) {
           console.error("Partition SVG introuvable.");
           return;
       }
   
   
       // Le SVG fait 7057 px de large alors que la fenêtre
       // d'affichage est beaucoup plus petite.
   
       const scoreContainer = score.parentElement;
   
       scoreContainer.style.overflow = "hidden";
       scoreContainer.style.width = "100%";
   
   
       // Empêche le navigateur de réserver une largeur de 7057 px
       // pour le SVG.
       score.style.display = "block";
   
   
       // ============================================================
       // CONVERSION TEMPS -> X
       // ============================================================
   
       function timeToX(time) {
   
           // Interpolation linéaire entre le premier et
           // le dernier point de synchronisation.
   
           return X_1 +
               (time - TIME_1) * PIXELS_PER_SECOND;
       }
   
   
       // ============================================================
       // YOUTUBE
       // ============================================================
   
       // Recherche de l'iframe correspondant à l'identifiant
       // indiqué dans data-youtube-url.
   
       const iframes = document.querySelectorAll(
           '.post__iframe iframe'
       );
   
       let youtubeIframe = null;
   
       for (const iframe of iframes) {
   
           try {
               const url = new URL(
                   iframe.src,
                   window.location.href
               );
   
               // Vérifie différentes formes possibles d'URL YouTube
               // contenant l'identifiant de la vidéo.
   
               if (
                   url.searchParams.get("v") === youtubeUrl ||
                   url.pathname.includes(youtubeUrl)
               ) {
                   youtubeIframe = iframe;
                   break;
               }
   
           } catch (error) {
               // Ignore une éventuelle URL d'iframe invalide.
           }
       }
   
   
       // Si l'iframe n'est pas identifiable par son URL,
       // on cherche éventuellement l'iframe qui contient
       // directement l'identifiant dans son src.
   
       if (!youtubeIframe) {
   
           for (const iframe of iframes) {
   
               if (
                   iframe.src &&
                   iframe.src.includes(youtubeUrl)
               ) {
                   youtubeIframe = iframe;
                   break;
               }
           }
       }
   
   
       if (!youtubeIframe) {
           console.error(
               "Iframe YouTube correspondant à data-youtube-url introuvable."
           );
           return;
       }
   
   
       // ============================================================
       // ACTIVE L'API JAVASCRIPT DE YOUTUBE
       // ============================================================
   
       const url = new URL(
           youtubeIframe.src,
           window.location.href
       );
   
       url.searchParams.set("enablejsapi", "1");
       url.searchParams.set(
           "origin",
           window.location.origin
       );
   
       youtubeIframe.src = url.toString();
   
   
       // ============================================================
       // FIN DE LA LECTURE
       // ============================================================
   
       let endTimeout = null;
   
   
       function onPlayerStateChange(event) {
   
           if (event.data === YT.PlayerState.ENDED) {
   
               clearTimeout(endTimeout);
   
               // Attendre 4 secondes après la fin de la vidéo
               endTimeout = setTimeout(() => {
   
                   score.style.transform =
                       "translateX(0px)";
   
               }, 4000);
           }
       }
   
   
       // ============================================================
       // CHARGEMENT DE L'API YOUTUBE
       // ============================================================
   
       let player = null;
   
   
       window.onYouTubeIframeAPIReady = function () {
   
           player = new YT.Player(
               youtubeIframe,
               {
                   events: {
                       onReady: onPlayerReady,
                       onStateChange: onPlayerStateChange
                   }
               }
           );
       };
   
   
       // Charge l'API YouTube si elle n'est pas déjà chargée.
       if (!window.YT) {
   
           const tag = document.createElement("script");
   
           tag.src =
               "https://www.youtube.com/iframe_api";
   
           document.head.appendChild(tag);
   
       } else {
   
           // L'API était déjà disponible.
           window.onYouTubeIframeAPIReady();
       }
   
   
       // ============================================================
       // MISE À JOUR DE LA PARTITION
       // ============================================================
   
       function onPlayerReady() {
   
           requestAnimationFrame(updateScore);
       }
   
   
       function updateScore() {
   
           if (
               player &&
               typeof player.getCurrentTime === "function"
           ) {
   
               const time = player.getCurrentTime();
   
               const x = timeToX(time);
   
               const parentWidth =
                   score.parentElement
                       .getBoundingClientRect()
                       .width;
   
               const targetX = parentWidth * 0.33;
   
               // Aucun déplacement tant que la note n'a pas
               // atteint 33 % de la fenêtre.
   
               const translateX =
                   Math.min(0, targetX - x);
   
               score.style.transform =
                   `translateX(${translateX}px)`;
           }
   
           requestAnimationFrame(updateScore);
       }
   
   })();</script></body></html>
